services:

  practicehexagonarchitectureapi:
    image: practicehexagonarchitectureapi
    ports:
      - '8080:8080'
      - '8081:8081'
    depends_on:
      - sqldatabase
    environment:
#      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1500;Database=PocHexagonArchitecture;User=sa;Password=Your_password123;"
#      ConnectionStrings__DefaultConnection: "Data Source=host.docker.internal, 1433;Initial Catalog=PocHexagonArchitecture;User ID=sa;Password=Your_password123;"
#      ConnectionStrings__DefaultConnection: "Data Source=sqldatabase,1433;Database=PocHexagonArchitecture;Integrated Security=false;User ID=sa;Password=Mssql!Passw0rd;TrustServerCertificate=True;"    
      ConnectionStrings__DefaultConnection: "Data Source=sqldatabase, 1433;Database=PocHexagonArchitecture;Integrated Security=false;User ID=sa;Password=Mssql!Passw0rd;TrustServerCertificate=true;"
    build:
      context: .
      dockerfile: src/Adapters/Driving/PracticeHexagonArchitecture.API/Dockerfile
      target: final

  sqldatabase:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: sqldatabase
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Mssql!Passw0rd'
    restart: always
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data: { }
    