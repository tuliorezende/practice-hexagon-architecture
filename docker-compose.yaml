services:
  practicehexagonarchitectureapi:
    depends_on:
      - sqlserver
    image: practicehexagonarchitectureapi
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=localhost,1433;Database=PocHexagonArchitecture;Integrated Security=false;User ID=sa;Password=Numsey@Password!;TrustServerCertificate=true"
    ports:
      - "8080:8080"
      - "8081:8081"
    build:
      context: .
      dockerfile: src/Adapters/Driving/PracticeHexagonArchitecture.API/Dockerfile
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2017-latest
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Numsey@Password!"
      MSSQL_PID: "Developer"
volumes:
  mssql_data: { }
  